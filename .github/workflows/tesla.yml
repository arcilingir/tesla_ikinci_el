name: Tesla Envanter Bot

on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dakikada bir
  workflow_dispatch:          # elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kurulum
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python tesla_bot.py

      - name: Görülenleri kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add gorulenler.json || true
          git diff --cached --quiet || (git commit -m "güncelle" && git push)
